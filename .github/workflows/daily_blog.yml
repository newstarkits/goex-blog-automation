name: Generador Diario de Blogs de IA (GOEX)

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC (09:00 CET / 10:00 CEST)
    - cron: "0 8 * * *"
  workflow_dispatch: # Permite ejecutar la acción manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Ejecutar scraper TechCrunch, generación multi-LLM, Pixabay y despliegue FTP a SiteGround
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || '46784606-438ba39acca420863fed8c139' }}
          FTP_HOST: ${{ secrets.FTP_HOST || 'ftp.goex-ia.com' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_USER: ${{ secrets.FTP_USER || 'bauto_marta@goex-ia.com' }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || 'Marta IA Goex' }}
          FTP_BLOG_DIR: ${{ secrets.FTP_BLOG_DIR || '/goex-ia.com/public_html/blog' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
          SEED_OLDER_ON_FIRST_RUN: "true"
        run: |
          python src/main.py

      - name: 2. Guardar y subir registro de noticias vistas (seen_news.txt)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_news.txt
          if git diff --staged --quiet; then
            echo "No hay cambios en seen_news.txt para commitear."
          else
            git commit -m "chore: actualizar histórico de noticias procesadas [skip ci]"
            git push
          fi
